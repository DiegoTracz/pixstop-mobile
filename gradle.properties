#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Versão do app — fonte única
#
# Lida pelo androidApp e pelo BuildKonfig. Os xcconfig do iOS e a tela "Sobre"
# seguem o mesmo valor. Lição do mobile-immo: com a versão em dois lugares, a
# loja ficou à frente do que o app dizia de si mesmo.
app.versionName=0.1.0
app.versionCode=1
